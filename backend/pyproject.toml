[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineguard-cv"
version = "0.2.0"
description = "CPU-first industrial computer-vision monitoring platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "opencv-python-headless>=4.10,<5.0",
  "alembic>=1.13,<2.0",
  "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
yolo-cpu = ["ultralytics>=8.3,<9.0", "torch>=2.4,<3.0"]
plc = ["pymodbus>=3.7,<4.0"]
industrial = ["ultralytics>=8.3,<9.0", "torch>=2.4,<3.0", "pymodbus>=3.7,<4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
